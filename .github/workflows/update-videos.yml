name: Update YouTube videos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/videos.py", ".github/workflows/update-videos.yml"]
  schedule:
    - cron: "23 * * * *"   # every hour

permissions:
  contents: write

concurrency:
  group: ifsc-videos
  cancel-in-progress: false

jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Read the three YouTube channels
        run: python3 tools/videos.py .

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media
          git diff --cached --quiet && echo "No new videos" || (git commit -m "Update videos" && git pull --rebase && git push)
