name: Build site images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/assets.py", ".github/workflows/build-assets.yml"]

permissions:
  contents: write

concurrency:
  group: ifsc-assets
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build logo, icons and share image
        run: |
          pip install --quiet pillow
          python3 tools/assets.py assets

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet && echo "No changes" || (git commit -m "Build site images" && git pull --rebase && git push)
